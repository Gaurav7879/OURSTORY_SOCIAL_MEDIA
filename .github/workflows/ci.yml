name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the runtime environment (swap for Python, Java, Go, etc.)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies cleanly
      - name: Install dependencies
        run: npm ci

      # 4. Run linter (optional, remove if not configured)
      - name: Run linter
        run: npm run lint --if-present

      # 5. Run automated tests
      - name: Run tests
        run: npm test

      # 6. Build the project to catch compilation errors
      - name: Build project
        run: npm run build --if-present
